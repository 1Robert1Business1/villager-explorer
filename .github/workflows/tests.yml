name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest  # Linux, like Streamlit Community Cloud
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (not movable tags) against supply-chain tampering.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"  # matches the Cloud deployment
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
