name: tls-live

# Live checks that the image fetcher rejects untrusted certificates under
# concurrency. The truststore bug this guards against is Windows/macOS-only, so
# the job runs on Windows as well as Linux; on Windows a mutation check also
# proves the bug still reproduces there (otherwise the guard proves nothing).
# Depends on badssl.com and dodo.ac being reachable, so it is kept out of the
# main test workflow (and its badge).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m network -rA
        env:
          NETWORK_TESTS: "1"
          REQUIRE_NETWORK_TESTS: "1"  # fail, rather than pass green, if nothing ran
